[project]
name = "ragtuner"
version = "0.0.1"
description = "Eval-driven RAG configuration tuner: profile a corpus, generate an eval set, search configs, diagnose failures, export the winner."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Fernando Garza"}]
dependencies = [
  "pymupdf>=1.24",
  "numpy>=1.26",
  "pyyaml>=6",
  "better-rag @ git+https://github.com/fernandogarzaaa/better-rag",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3"]
llm = ["anthropic>=1"]
docling = ["docling>=2.0"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ragtuner = "ragtuner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ragtuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ragtuner"]
ignore_missing_imports = true
